<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card</title>>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="id-card">
  
        <header class="card-header">
            <h3>INTERN IDENTIFICATION</h3>
            <p>National information Technology Development Agency </p>
        </header>

b
        <div class="photo-container">
            <img src="image.img" alt="Profile Photo" class="profile-photo">
        </div>

    
        <main class="card-body">
            <h2 class="name">Big Boss</h2>
            <p class="role">Intern</p>

            <div class="details-box">
                <div class="detail-row">
                    <span class="label">ID Number:</span>
                    <span class="value">088</span>
                </div>
                <div class="detail-row">
                    <span class="label">Department:</span>
                    <span class="value">DDS</span>
                </div>
                <div class="detail-row">
                    <span class="label">Issue Date:</span>
                    <span class="value">Aug 2026</span>
                </div>
                <div class="detail-row">
                    <span class="label">Expiry Date:</span>
                    <span class="value">Aug 2028</span>
                </div>
            </div>
        </main>
     
    </div>

</body>
</html>
